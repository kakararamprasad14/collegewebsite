<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Modern, student-first digital hub for college notices, exam timetables, class schedules, results, and student services.">
  <meta name="theme-color" content="#1a56db">
  <title>Student Hub | College Digital Portal</title>

  <!-- Design System & Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <!-- Accessibility Skip Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="app-shell">
    <!-- Top Utility Header / Institutional App Bar -->
    <header class="app-header" role="banner">
      <div class="header-container">
        <!-- Brand Emblem & Title -->
        <a href="#home" class="brand-section" aria-label="College Student Hub Home">
          <div class="brand-emblem" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <div class="brand-info">
            <span class="brand-title">CAMPUS HUB</span>
            <span class="brand-subtitle">Student Digital Portal</span>
          </div>
        </a>

        <!-- Header Actions: Search trigger, Notifications & Profile Avatar -->
        <div class="header-actions">
          <button class="search-trigger-btn" id="header-search-btn" aria-label="Open universal search (Ctrl + K)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <span class="search-text">Search portal...</span>
            <kbd class="search-kbd-shortcut">Ctrl K</kbd>
          </button>

          <a href="#notices" class="icon-action-btn" aria-label="View official circulars and notifications">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span class="unread-badge" aria-hidden="true"></span>
          </a>

          <div class="student-avatar-pill" role="button" tabindex="0" aria-label="View Rohan's Profile">
            <div class="avatar-circle">RS</div>
            <span class="avatar-name">Rohan</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Desktop Navigation Bar (Visible on Viewports >= 768px) -->
    <nav class="desktop-nav" aria-label="Primary Desktop Navigation">
      <div class="desktop-nav-container">
        <a href="#home" class="nav-item-link active" data-route="home">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          HOME
        </a>
        <a href="#notices" class="nav-item-link" data-route="notices">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          NOTICES
        </a>
        <a href="#academics" class="nav-item-link" data-route="academics">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          ACADEMICS
        </a>
        <a href="#exams" class="nav-item-link" data-route="exams">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          EXAMS
        </a>
        <a href="#campus" class="nav-item-link" data-route="campus">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
          </svg>
          CAMPUS
        </a>
        <a href="#services" class="nav-item-link" data-route="services">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          STUDENT SERVICES
        </a>
        <a href="#profile" class="nav-item-link" data-route="profile">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          PROFILE
        </a>
      </div>
    </nav>

    <!-- Main Content Dynamic Landmark Container -->
    <main id="main-content" class="main-content" role="main" tabindex="-1">
      <div id="view-container">
        <!-- Dynamic views are injected here by js/app.js -->
      </div>
    </main>

    <!-- Mobile Bottom Navigation (Ergonomic Thumb Reach Zone for Viewports < 768px) -->
    <nav class="mobile-bottom-nav" aria-label="Primary Mobile Navigation">
      <button class="mobile-nav-btn active" data-route="home" aria-label="Navigate to Home Dashboard">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </button>
      <button class="mobile-nav-btn" data-route="notices" aria-label="Navigate to Notices">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span>Notices</span>
      </button>
      <button class="mobile-nav-btn" data-route="academics" aria-label="Navigate to Academics">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        <span>Academics</span>
      </button>
      <button class="mobile-nav-btn" data-route="exams" aria-label="Navigate to Exams">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>Exams</span>
      </button>
      <button class="mobile-nav-btn" data-route="more" id="mobile-more-trigger" aria-label="Open more navigation options">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
        </svg>
        <span>More</span>
      </button>
    </nav>

    <!-- Mobile More Drawer Sheet -->
    <div id="mobile-more-sheet" class="mobile-more-backdrop" role="dialog" aria-modal="true" aria-label="Additional Navigation Hubs" aria-hidden="true">
      <div class="mobile-more-drawer">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); padding-bottom: var(--space-2); border-bottom: 1px solid var(--color-border);">
          <span style="font-weight: var(--font-weight-bold); font-size: var(--text-h3);">More Hubs & Services</span>
          <button id="close-more-sheet" class="btn-icon" aria-label="Close menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3);">
          <a href="#services" class="quick-action-tile more-sheet-link" style="min-height: auto;">
            <div class="quick-action-label">Student Services</div>
            <div class="quick-action-desc">Certificates & Dues</div>
          </a>
          <a href="#campus" class="quick-action-tile more-sheet-link" style="min-height: auto;">
            <div class="quick-action-label">Campus Life</div>
            <div class="quick-action-desc">Events, Clubs & Map</div>
          </a>
          <a href="#profile" class="quick-action-tile more-sheet-link" style="min-height: auto;">
            <div class="quick-action-label">Profile & Saved</div>
            <div class="quick-action-desc">Rohan (1MS22CS084)</div>
          </a>
          <button id="mobile-sheet-search-trigger" class="quick-action-tile more-sheet-link" style="min-height: auto; width: 100%; border: 1px solid var(--color-primary-border); background: var(--color-primary-subtle); text-align: left;">
            <div class="quick-action-label" style="color: var(--color-primary);">Search Hub</div>
            <div class="quick-action-desc">Find anything</div>
          </button>
        </div>
      </div>
    </div>

    <!-- Omni-Search Modal Dialog Overlay -->
    <div id="search-modal" class="search-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="search-modal-label" aria-hidden="true">
      <div class="search-dialog">
        <div class="search-input-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <label for="search-input" id="search-modal-label" class="sr-only">Search student portal</label>
          <input type="text" id="search-input" class="search-input-field" placeholder="Search notices, exams, courses, faculty, services..." autocomplete="off">
          <button id="search-clear-input-btn" class="search-clear-btn" aria-label="Clear search query">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
          <button id="search-close-btn" class="btn btn--outline btn--sm" aria-label="Close search dialog">ESC</button>
        </div>
        <div id="search-results" class="search-results-container" role="region" aria-live="polite">
          <!-- Populated dynamically by js/search.js -->
        </div>
      </div>
    </div>

    <!-- Reusable Toast Notification Host -->
    <div class="toast-container" role="region" aria-live="polite"></div>
  </div>

  <!-- Application Logic Modules -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
